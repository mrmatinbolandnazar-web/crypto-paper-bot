name: Crypto Paper Bot V5.1

on:
  workflow_dispatch:
  schedule:
    - cron: "3-58/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-paper-bot-v5-1
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run V5.1 paper bot
        run: python bot_v5_1.py

      - name: Save V5.1 bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state_v5_1.json paper_trades_v5_1.csv
          git diff --cached --quiet || git commit -m "Update V5.1 paper bot state"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push
